<!doctype html>
<!-- openlyoperated.biz — SEEDED MOCK (the populated reference; NOT deployable). Shares the lit shell
     (app.js) with the empty scaffold (index.html); this file only supplies seeded data + the populated
     region templates + the live tick. Same reactive desktop/phone layout via app.css. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>openlyoperated.biz · demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<p style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;">agents: this dashboard is a client-rendered app — raw markup is an empty shell. read https://openlyoperated.biz/llms.txt for what this site is, the planned data contracts, and where the substance lives.</p>
<div id="root"></div>
<script type="module">
import { mount, state, on, html, nothing, spark, bigChart, fmtMoney, fmtPlain, fmtClock, pad, hash, rngFor, pick, SEC_ORDER, SORT_LABELS, sectorsTpl } from './app.js';

/* ---------- seeded dataset ---------- */
const C = { UP:'#3a7d52', DOWN:'#b04a3f', MUT:'#7d7b71' };
const RAW = [
  ['Tanners Coffee Co','cafe','Riverton',58000,.31,'up',{kind:'margin',text:'margin 31% · retained-earnings curve steepening'}],
  ['Mill & Sparrow Bakery','bakery','Eastgate',47000,.29,'up',{kind:'energy',text:'oven 1.4 kWh/batch · 18% over peer median'}],
  ['Norba','restaurant','Old Town',162000,.12,'flat',null],
  ['Cresswell Roasters','roaster','Industrial',240000,.22,'up',{kind:'supply',text:'beans $0.42/oz · lowest in region'}],
  ['Blue Hour Cafe','cafe','Harbor',41000,.38,'up',{kind:'price-high',text:'62% gross margin · priciest cup on Harbor'}],
  ['Patch & Crumb','bakery','Riverton',33000,.26,'down',null],
  ['Saltwise Deli','restaurant','Harbor',88000,.16,'up',null],
  ['Gearhouse Cycles','retail','Eastgate',72000,.34,'flat',{kind:'fees',text:'14% to Square in processor fees · 30d'}],
  ['Foliage Bar','bar','Old Town',110000,.19,'up',null],
  ['Press & Fold Print','retail','Industrial',39000,.28,'down',null],
  ['Daybreak Cafe','cafe','Northside',52000,.27,'up',{kind:'fees',text:'13% to Square · migration candidate'}],
  ['Greenline Grocers','retail','Northside',205000,.09,'flat',null],
  ['Anvil Pizza','restaurant','Eastgate',134000,.14,'up',{kind:'energy',text:'swapped to 1.19 kWh element · bill -15%'}],
  ['Wren Teahouse','cafe','Harbor',36000,.33,'up',{kind:'price-low',text:'$3.80 cup · 33% margin · best value on Harbor'}],
  ['Hollow Reed Brewing','bar','Industrial',178000,.21,'up',{kind:'supply',text:'kegs $118/bbl · supplies 4 bars'}],
  ['Sunday Provisions','retail','Old Town',64000,.30,'up',null]
];
const BIZ = RAW.map((row,idx)=>{
  const [name,sector,city,rev,margin,dir,opp]=row, r=rngFor(hash(name));
  const drift=dir==='up'?0.012:dir==='down'?-0.011:0; let v=0.5+r()*0.25; const series=[];
  for(let i=0;i<30;i++){v=v*(1+drift)+(r()-0.5)*0.025;series.push(v);}
  const trendPct=(series[series.length-1]-series[0])/series[0];
  const color=dir==='up'?C.UP:dir==='down'?C.DOWN:C.MUT;
  return {id:'b'+idx,name,sector,sectorLabel:sector,city,rev,revFmt:fmtMoney(rev),margin,marginPct:Math.round(margin*100)+'%',
    reFmt:fmtMoney(rev*margin*5.4*(0.8+r()*0.6)),cashFmt:fmtMoney(rev*(0.4+r()*0.7)),series,color,trendPct,opp,lastEvent:(1+Math.floor(r()*14))+'m ago'};
});
const BY_ID={},BY_NAME={},COUNTS={all:BIZ.length}; BIZ.forEach(b=>{BY_ID[b.id]=b;BY_NAME[b.name]=b;COUNTS[b.sector]=(COUNTS[b.sector]||0)+1;});
const OPPS=[
  {tag:'fees',prize:'$312k/yr',title:'processor fees leaking to Square & Stripe',where:'Gearhouse, Daybreak +10 shops at >12%',cta:{engineer:'ship a migration module',owner:'cut my fees'},act:'shipped a Toast module — six shops live by friday',biz:'Gearhouse Cycles'},
  {tag:'energy',prize:'$286k/yr',title:'toaster & oven kWh above peer median',where:'200 cafes pulling 1.4 kWh/batch',cta:{engineer:'ship a hardware spec',owner:'swap the element'},act:'my element does 1.19 kWh — letters of intent out',biz:'Mill & Sparrow Bakery'},
  {tag:'margin',prize:'+12.4%/yr',title:'31% margin, retained-earnings steepening',where:'Tanners Coffee Co · Riverton',cta:{investor:'open a position',owner:'benchmark my shop'},act:'bought into their dividend rule last night',biz:'Tanners Coffee Co'},
  {tag:'supply',prize:'$0.09/oz',title:'beans priced under the street',where:'Cresswell Roasters supplies the harbor',cta:{owner:'requote my supplier',investor:'price the spread'},act:"our agent's requoting the roaster in the morning",biz:'Cresswell Roasters'},
  {tag:'price',prize:'−16%',title:'same cup, lower price',where:'Wren $3.80 vs Blue Hour $4.50',cta:{consumer:'get directions',owner:'check my pricing'},act:"three within a mile — i know where i'm going",biz:'Wren Teahouse'},
  {tag:'modules',prize:'6 shipped',title:'new modules on the feed this week',where:'payments · iot · migrations',cta:{engineer:'browse modules',owner:'auto-adopt'},act:"my agent ordered two — bill's down 15%",biz:null}
];
const TICKER=['$312k/yr leaking to Square — ship a migration module','200 toasters at 1.4 kWh/batch — better element wanted','Tanners · 31% margin · RE steepening — position open','Cresswell beans $0.42/oz — $0.09 under street','Wren $3.80 vs Blue Hour $4.50 a cup','6 modules shipped this week','Anvil bill −15% after element swap'];
const JOURNAL_MEMOS=[['daily card settlement','cash','accounts receivable'],['vendor bill received','inventory','accounts payable'],['cogs recognized','cogs','inventory'],['payroll run','wages','cash'],['utility autopay','utilities','cash'],['cash sales','cash','revenue']];
const IOT={cafe:[['espresso boiler','92°C'],['toaster-01','1.39 kWh/batch'],['walk-in cooler','3.1°C'],['hood amps','9.4 A']],bakery:[['deck oven','1.41 kWh/batch'],['proof box','27°C'],['walk-in cooler','3.4°C'],['mixer load','2.2 A']],restaurant:[['hood amps','11.2 A'],['walk-in cooler','2.9°C'],['fryer','176°C'],['dish machine','64°C']],roaster:[['roaster drum','214°C'],['cooling tray','38°C'],['kWh/batch','3.7'],['green store','19°C']],bar:[['glycol chiller','1.2°C'],['walk-in cooler','3.0°C'],['co2 line','740 psi'],['hood amps','8.1 A']]};
const EV_NAMES=['ken','mara','desi','luis','priya','sam','wen','ada'],EV_ITEMS=['oat milk','espresso beans','eggs · dozen','flour 25kg','to-go cups','butter','tomatoes'],EV_SUPP=['Cresswell Roasters','Hollow Reed','Greenline Grocers','Northwood Dairy'],EV_ACCTS=[['inventory','accounts payable'],['cogs','inventory'],['cash','revenue'],['accounts receivable','revenue'],['wages','cash']],EV_PROC=['stripe','square','paypal'],EV_DEVS=['toaster-01 · 1.39 kWh','walk-in · 3.1°C','espresso boiler · 92°C','oven-02 · 1.41 kWh'];
let eid=1;
function makeEvent(){
  const b=pick(BIZ);
  const fns=[
    ()=>{const a=pick(EV_ACCTS);return{tag:'accounting.journal_posted',gloss:`dr ${a[0]} / cr ${a[1]} · ${fmtPlain(120+Math.random()*3800)}`};},
    ()=>({tag:'payments.received',gloss:`${pick(EV_PROC)} · ${fmtPlain(8+Math.random()*240)}`}),
    ()=>({tag:'purchasing.quote_requested',gloss:`${pick(EV_ITEMS)} · req → ${pick(EV_SUPP)}`}),
    ()=>({tag:'labor.clock_in',gloss:`${pick(EV_NAMES)} clocked in`}),
    ()=>({tag:'inventory.movement',gloss:`${pick(EV_ITEMS)} · −${1+Math.floor(Math.random()*9)} units`}),
    ()=>({tag:'iot.reading',gloss:pick(EV_DEVS)}),
    ()=>({tag:'invoicing.issued',gloss:`invoice #${1000+Math.floor(Math.random()*9000)} · ${fmtPlain(200+Math.random()*4000)}`})
  ];
  return {id:eid++,biz:b.name,time:fmtClock(new Date()),...pick(fns)()};
}

/* ---------- derived ---------- */
function filteredSorted(){
  const q=state.query.trim().toLowerCase();
  const list=BIZ.filter(b=>(state.sector==='all'||b.sector===state.sector)&&(!q||b.name.toLowerCase().includes(q)||b.city.toLowerCase().includes(q)||b.sector.includes(q)));
  const k=state.sortKey,d=state.sortDir;
  return list.slice().sort((a,b)=>{
    if(k==='name')return a.name.toLowerCase()<b.name.toLowerCase()?-d:a.name.toLowerCase()>b.name.toLowerCase()?d:0;
    const av=k==='rev'?a.rev:k==='margin'?a.margin:a.trendPct, bv=k==='rev'?b.rev:k==='margin'?b.margin:b.trendPct;
    return (av-bv)*d;
  });
}
const trendStr=b=>(b.trendPct>=0?'+':'')+Math.round(b.trendPct*100)+'%';
function signalFor(p){
  const byTrend=BIZ.slice().sort((a,b)=>b.trendPct-a.trendPct);
  const fee=BIZ.filter(b=>b.opp&&(b.opp.kind==='fees'||b.opp.kind==='energy'));
  const lows=BIZ.filter(b=>b.opp&&b.opp.kind==='price-low'),highs=BIZ.filter(b=>b.opp&&b.opp.kind==='price-high');
  if(p==='engineer')return{kicker:'engineer lens',title:'opportunities to ship labor',items:fee.slice(0,3).map(b=>`${b.name} — ${b.opp.text}`),quote:'“saw twelve cafes burning 14% on Square fees — shipped a Toast migration module.”'};
  if(p==='investor')return{kicker:'investor lens',title:'steepest retained-earnings curves',items:byTrend.slice(0,3).map(b=>`${b.name} — re ${trendStr(b)} · margin ${b.marginPct}`),quote:'“margin 31%, retained-earnings curve steeper than anything else I hold — bought in.”'};
  if(p==='consumer')return{kicker:'consumer lens',title:'where the deal is',items:lows.concat(highs).map(b=>`${b.name} — ${b.opp.text}`).slice(0,3),quote:'“three cafes within a mile — I know exactly which one isn’t running a 62% margin.”'};
  if(p==='owner')return{kicker:'owner lens',title:'crowdsourced wins on the feed',items:['Anvil Pizza — a module on the feed cut the electric bill 15%','Cresswell Roasters — beans $0.42/oz · requote your roaster','peer median margin in cafe: 31% · you’re benchmarked live'],quote:'“my agent ran a ‘terraform command’ and now I accept Stripe payments.”'};
  return{kicker:'regulator lens',title:'audit as a diff',items:['16 businesses · published balances = recomputed from journal','0 divergences across the public ledger','no interpretive layer between events and the numbers'],quote:'“recompute from the journal, diff against the cache — any divergence is a bug.”'};
}

/* ---------- populated region templates ---------- */
const ticker=()=>{const item=t=>html`<span class="mono" style="display:inline-flex;align-items:center;gap:9px;font-size:12px;color:#e7e4da;"><span style="width:7px;height:7px;border-radius:2px;background:#df722a;flex:none;"></span>${t}</span>`;
  return html`<div class="oo-ticker"><div class="oo-band oo-wide">
    <div style="flex:none;display:flex;align-items:center;gap:8px;padding:0 18px 0 30px;height:34px;background:#16181d;border-right:1px solid #2a2c31;"><span class="dot"></span><span class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:#b7b4a8;white-space:nowrap;">live opportunities</span></div>
    <div style="position:relative;overflow:hidden;flex:1;height:34px;"><div class="oo-marquee" style="position:absolute;left:0;top:0;height:34px;display:flex;align-items:center;gap:36px;white-space:nowrap;animation:oo-marquee 40s linear infinite;">${TICKER.map(item)}${TICKER.map(item)}</div></div>
  </div></div>`;};

const kpiCell=(label,val,color)=>html`<div class="oo-kpi-cell"><div class="lbl">${label}</div><div class="oo-kpi-val" style=${color?'color:'+color:''}>${val}</div></div>`;
const kpi=()=>html`<div class="oo-kpi" data-mtab="opps"><div class="oo-band"><div class="oo-kpi-row">
  ${kpiCell('businesses live','16')}<div class="oo-kpi-div"></div>${kpiCell('published 30d','$1.81M')}<div class="oo-kpi-div"></div>${kpiCell('median margin','26%')}<div class="oo-kpi-div"></div>${kpiCell('fees avoided 30d','$312k','#3a7d52')}<div class="oo-kpi-div"></div>${kpiCell('events today',state.eventsToday.toLocaleString('en-US'))}<div class="oo-kpi-div"></div>${kpiCell('divergences','0')}
</div></div></div>`;

const opps=()=>{
  const rel=OPPS.filter(o=>o.cta[state.persona]).length;
  const sorted=OPPS.slice().sort((a,b)=>(b.cta[state.persona]?1:0)-(a.cta[state.persona]?1:0));
  return html`<div class="oo-oppsband" data-mtab="opps"><div class="oo-band oo-wide">
    <div style="display:flex;align-items:baseline;gap:14px;margin-bottom:14px;flex-wrap:wrap;"><h2 class="oo-h">open opportunities</h2><span class="mono" style="font-size:11.5px;color:#9a988c;">6 surfaced · $598k/yr recoverable cost on the table</span><span style="flex:1;"></span><span class="mono" style="display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:#df722a;"><span class="dot" style="width:6px;height:6px;"></span>${rel} matched to your ${state.persona} lens</span></div>
    <div class="oo-opps-track oo-scroll">${sorted.map(o=>{
      const on_=!!o.cta[state.persona], ob=o.biz?BY_NAME[o.biz]:null;
      return html`<div class="oo-oppcard" @click=${()=>ob&&on.open(ob.id)} style="flex:none;width:296px;display:flex;flex-direction:column;gap:6px;padding:14px 16px 15px;background:#fffefb;border:1px solid #e5e3da;border-top:3px solid ${on_?'#df722a':'#e0ded4'};border-radius:14px;cursor:pointer;opacity:${on_?1:.62};min-height:196px;">
        <div style="display:flex;align-items:center;"><span class="mono" style="padding:3px 8px;border-radius:6px;background:#33322c;color:#f4f2ec;font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;">${o.tag}</span><span style="flex:1;"></span><span class="mono" style="font-size:18px;font-weight:600;color:${on_?'#df722a':'#a8a698'};">${o.prize}</span></div>
        <div style="font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.3;margin-top:3px;">${o.title}</div>
        <div class="mono" style="font-size:10.5px;color:#9a988c;line-height:1.4;">${o.where}</div><span style="flex:1;"></span>
        <div style="margin-top:7px;"><button style=${on_?'padding:7px 13px;border:0;border-radius:9px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(95deg,#f4b73c,#df722a);':'padding:7px 13px;border:1px solid #d4d1c5;border-radius:9px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;color:#7d7b71;background:transparent;'}>${o.cta[state.persona]||'watch ↗'}</button></div>
        <div class="mono" style="font-size:10.5px;font-style:italic;color:${on_?'#df722a':'#a8a698'};line-height:1.4;margin-top:2px;">“${o.act}”</div>
      </div>`;})}</div>
  </div></div>`;
};

const left=()=>html`<aside class="oo-left" data-mtab="biz">
  <div class="lbl" style="margin-bottom:11px;letter-spacing:.12em;">sector</div>${sectorsTpl(COUNTS)}
  <div class="oo-desktoponly">
    <div class="lbl" style="margin:26px 0 11px;letter-spacing:.12em;">event domains</div>
    <div class="mono" style="display:flex;flex-direction:column;gap:7px;font-size:11.5px;color:#6d6b61;">${['accounting','purchasing','payments','labor','inventory','iot','invoicing'].map(d=>html`<div style="display:flex;align-items:center;gap:8px;"><span style="width:7px;height:7px;border-radius:2px;background:#b3b0a4;"></span>${d}</div>`)}</div>
    <div class="mono" style="margin-top:26px;padding:13px 14px;border:1px dashed #d4d1c5;border-radius:10px;font-size:11px;line-height:1.5;color:#8a887d;">public · spec-compliant. every figure here recomputes from the published event stream.</div>
  </div>
</aside>`;

const caret=k=>state.sortKey===k?(state.sortDir<0?' ↓':' ↑'):'';
const th=(label,key,right)=>html`<th @click=${key?()=>on.sort(key):null} class="mono" style="text-align:${right?'right':'left'};padding:.85em .9em;font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#7d7b71;font-weight:600;border-bottom:1px solid #d4d1c5;white-space:nowrap;${key?'cursor:pointer;':''}">${label}${key?caret(key):''}</th>`;
const center=()=>{const list=filteredSorted();
  return html`<main class="oo-center" data-mtab="biz">
    <div style="display:flex;align-items:baseline;gap:12px;padding:0 0 14px;flex-wrap:wrap;"><h2 class="oo-h">business screener</h2><span class="mono" style="font-size:11.5px;color:#9a988c;">${list.length} openly-operated · sorted by ${SORT_LABELS[state.sortKey]}</span></div>
    <div class="oo-desktoponly oo-scroll" style="overflow-x:auto;border:1px solid #e5e3da;border-radius:12px;background:#fffefb;">
      <table style="width:100%;min-width:640px;border-collapse:collapse;font-size:13px;" cellspacing="0">
        <thead><tr style="background:#f5f4ef;">${th('business','name')}${th('sector')}${th('rev 30d','rev',1)}${th('margin','margin',1)}${th('retained · 90d','trend')}${th('signal')}${th('last event','',1)}</tr></thead>
        <tbody>${list.map(b=>html`<tr class="oo-row" @click=${()=>on.open(b.id)} style="border-bottom:1px solid #efeee8;">
          <td style="padding:.7em 1em;border-bottom:1px solid #efeee8;"><div style="font-weight:600;font-size:13.5px;letter-spacing:-.01em;">${b.name}</div><div class="mono" style="font-size:10.5px;color:#9a988c;margin-top:1px;">${b.city}</div></td>
          <td class="mono" style="padding:.7em .6em;border-bottom:1px solid #efeee8;font-size:11px;color:#7d7b71;">${b.sectorLabel}</td>
          <td class="mono" style="padding:.7em .9em;border-bottom:1px solid #efeee8;text-align:right;font-size:13px;">${b.revFmt}</td>
          <td class="mono" style="padding:.7em .9em;border-bottom:1px solid #efeee8;text-align:right;font-size:13px;">${b.marginPct}</td>
          <td style="padding:.7em .9em;border-bottom:1px solid #efeee8;"><div style="display:flex;align-items:center;gap:9px;">${spark(b.series,b.color)}<span class="mono" style="font-size:12px;color:${b.color};font-weight:500;min-width:46px;">${trendStr(b)}</span></div></td>
          <td style="padding:.7em .9em;border-bottom:1px solid #efeee8;max-width:230px;"><span class="mono" style="font-size:${b.opp?'11px':'12px'};color:${b.opp?'#7d7b71':'#c4c1b4'};line-height:1.35;">${b.opp?b.opp.text:'—'}</span></td>
          <td class="mono" style="padding:.7em 1em;border-bottom:1px solid #efeee8;text-align:right;font-size:11px;color:#9a988c;white-space:nowrap;">${b.lastEvent}</td></tr>`)}</tbody>
      </table>
    </div>
    <div class="oo-mobileonly" style="border:1px solid #e5e3da;border-radius:12px;background:#fffefb;overflow:hidden;">${list.map(b=>html`
      <div class="oo-row" @click=${()=>on.open(b.id)} style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid #efeee8;">
        <div style="min-width:0;"><div style="font-weight:600;font-size:14px;letter-spacing:-.01em;">${b.name}</div><div class="mono" style="font-size:10px;color:#9a988c;margin-top:1px;">${b.sectorLabel} · ${b.city}</div>${b.opp?html`<div class="mono" style="font-size:10px;color:#7d7b71;margin-top:3px;line-height:1.3;">${b.opp.text}</div>`:nothing}</div>
        <div style="text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;"><div class="mono" style="font-size:13px;">${b.revFmt}</div><div style="display:flex;align-items:center;gap:7px;">${spark(b.series,b.color)}<span class="mono" style="font-size:11px;color:${b.color};font-weight:500;">${trendStr(b)}</span></div><div class="mono" style="font-size:10px;color:#9a988c;">marg ${b.marginPct}</div></div>
      </div>`)}</div>
  </main>`;};

const right=()=>{const sig=signalFor(state.persona);
  return html`<aside class="oo-right" data-mtab="stream">
    <div style="border:1px solid #d4d1c5;border-radius:12px;padding:16px;background:#fffefb;">
      <div class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:#9a988c;">${sig.kicker}</div>
      <div style="font-size:14.5px;font-weight:600;letter-spacing:-.01em;margin:5px 0 12px;">${sig.title}</div>
      <div style="display:flex;flex-direction:column;gap:9px;">${sig.items.map(t=>html`<div style="display:flex;gap:9px;align-items:flex-start;"><span style="width:5px;height:5px;border-radius:50%;background:#df722a;margin-top:6px;flex:none;"></span><div class="mono" style="font-size:11.5px;line-height:1.45;color:#3a3a34;">${t}</div></div>`)}</div>
      <div class="mono" style="margin-top:13px;padding-top:11px;border-top:1px solid #efeee8;font-size:11px;color:#df722a;font-style:italic;">${sig.quote}</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin:20px 0 11px;"><span class="dot"></span><span class="mono" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:#7d7b71;">live event stream</span><span style="flex:1;"></span><span class="mono" style="font-size:10px;color:#b3b0a4;">spec v1 · public</span></div>
    <div class="oo-scroll" style="overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:1px;border:1px solid #e5e3da;border-radius:11px;background:#fffefb;padding:5px;">
      ${state.events.map((e,i)=>html`<div style="padding:9px 11px;border-radius:8px;background:${i===0?'#df722a14':'transparent'};border-left:2px solid ${i===0?'#df722a':'transparent'};"><div style="display:flex;align-items:baseline;gap:8px;"><span class="mono" style="font-size:10px;color:#b3b0a4;flex:none;">${e.time}</span><span class="mono" style="font-size:10.5px;color:#6d6b61;font-weight:600;">${e.tag}</span></div><div class="mono" style="font-size:11.5px;color:#2a2a25;margin-top:3px;line-height:1.35;">${e.gloss}</div><div style="font-size:11px;color:#9a988c;margin-top:2px;">${e.biz}</div></div>`)}
    </div>
  </aside>`;};

const drawer=()=>{
  const b=state.selected&&BY_ID[state.selected]; if(!b)return nothing;
  const r=rngFor(hash(b.name));
  const journal=JOURNAL_MEMOS.map((m,i)=>({date:'06/'+pad(24-i),memo:m[0],dr:m[1],cr:m[2],amt:fmtPlain(180+r()*4200)}));
  const iot=IOT[b.sector]||[];
  const tile=(l,v)=>html`<div style="background:#fffefb;padding:13px 14px;"><div class="mono" style="font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#9a988c;">${l}</div><div class="mono" style="font-size:17px;font-weight:500;margin-top:4px;">${v}</div></div>`;
  return html`<div class="oo-backdrop" @click=${on.close}></div>
    <div class="oo-sheet oo-scroll"><div style="padding:24px 28px;">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;"><div><div style="font-size:22px;font-weight:700;letter-spacing:-.02em;">${b.name}</div><div class="mono" style="font-size:11.5px;color:#8a887d;margin-top:4px;">${b.sectorLabel} · ${b.city} · openly operated since 2025</div></div><button @click=${on.close} style="border:1px solid #d4d1c5;background:#fffefb;width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:15px;color:#7d7b71;line-height:1;flex:none;">✕</button></div>
      <div class="oo-tiles">${tile('rev 30d',b.revFmt)}${tile('margin',b.marginPct)}${tile('cash',b.cashFmt)}${tile('retained',b.reFmt)}</div>
      <div style="margin-top:18px;border:1px solid #e5e3da;border-radius:11px;background:#fffefb;padding:15px 16px;"><div style="display:flex;align-items:baseline;justify-content:space-between;"><span class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#9a988c;">retained earnings · 90d</span><span class="mono" style="font-size:12px;color:${b.color};font-weight:600;">${trendStr(b)} · 90d</span></div><div style="margin-top:10px;">${bigChart(b.series,b.color)}</div></div>
      <div style="margin-top:18px;border:1px solid #bfe0cc;border-radius:11px;background:#eef6f0;padding:15px 16px;"><div style="display:flex;align-items:center;gap:9px;"><span style="width:18px;height:18px;border-radius:50%;background:#3a7d52;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;flex:none;">✓</span><span style="font-weight:600;font-size:13.5px;color:#27613e;">audit as a diff</span><span style="flex:1;"></span><span class="mono" style="font-size:12px;color:#27613e;font-weight:600;">divergence $0.00</span></div><div class="mono" style="font-size:11px;line-height:1.55;color:#3f6b51;margin-top:9px;">balances recomputed from the journal, diffed against the materialized cache. two paths, same answer. published numbers that can't be reconstructed from published events aren't numbers — they're claims.</div></div>
      <div style="margin-top:18px;"><div class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#9a988c;margin-bottom:9px;">journal · immutable · append-only</div><div style="border:1px solid #e5e3da;border-radius:11px;overflow:hidden;background:#fffefb;">${journal.map(j=>html`<div class="mono" style="display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid #f0efe9;font-size:11.5px;"><span style="color:#9a988c;flex:none;width:42px;">${j.date}</span><span style="color:#2a2a25;flex:1;min-width:0;">${j.memo}</span><span style="color:#6d6b61;flex:none;">dr ${j.dr}</span><span style="color:#9a988c;flex:none;">cr ${j.cr}</span><span style="color:#1a1a17;font-weight:500;flex:none;width:74px;text-align:right;">${j.amt}</span></div>`)}</div></div>
      ${iot.length?html`<div style="margin-top:18px;"><div class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#9a988c;margin-bottom:9px;">iot telemetry · public stream</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">${iot.map(d=>html`<div style="border:1px solid #e5e3da;border-radius:9px;background:#fffefb;padding:11px 13px;"><div class="mono" style="font-size:10.5px;color:#3f8a8a;">${d[0]}</div><div class="mono" style="font-size:15px;font-weight:500;margin-top:3px;">${d[1]}</div></div>`)}</div></div>`:nothing}
      <div class="mono" style="margin-top:20px;font-size:10.5px;color:#a8a698;line-height:1.5;">everything on this panel is served by api.openlyoperated.biz and recomputable from the public event stream.</div>
    </div></div>`;
};

/* ---------- boot ---------- */
for(let i=0;i<14;i++) state.events.unshift(makeEvent());
mount({
  root: document.getElementById('root'),
  regions: { ticker, kpi, opps, left, center, right, drawer },
  banner: true, hasMin: true,
  tick: () => { state.events=[makeEvent(),...state.events].slice(0,32); state.eventsToday+=1+Math.floor(Math.random()*3); state.eventsPerMin=42+Math.floor(Math.random()*12); }
});
</script>
</body>
</html>
