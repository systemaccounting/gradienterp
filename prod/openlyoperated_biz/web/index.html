<!--
  openlyoperated.biz — public dashboard. DEPLOYABLE EMPTY STATE · REACTIVE (desktop + mobile).
  Shares the lit shell (app.js) + styles (app.css) with the seeded demo (index.mock.html); this file
  supplies the empty/annotated region templates. Every populatable region is empty and annotated with
  the api/stream that fills it. Nothing fabricated — safe to ship as the live main page.

  ── DATA CONTRACTS to reach desired state (identical for desktop + mobile) ──
  Backend: api.openlyoperated.biz/v1 (prod/api_openlyoperated) — the directory, the read-through,
  the economy's counters, and the stream on events.openlyoperated.biz. Built regions read from it;
  the rest are annotated with the call that will fill them. api.openlyoperated.biz/v1/llms.txt.

    region         method  endpoint                                    shape
    ----------------------------------------------------------------------------------------------
    ticker         GET     /opportunities?top=7                        items { text }
    kpis           GET     /network/kpis                               { businesses_live, published_volume_30d,
                                                                         median_margin, fees_avoided_30d,
                                                                         events_today, audit_divergences }
    opportunities  GET     /opportunities?lens={persona}               cards { tag, prize, title, where,
                                                                         cta_by_lens, activity, business_id }
    screener       GET     /businesses?sort={key}&dir={dir}            rows  { id, name, city, sector, rev_30d,
                           &sector={sector}&q={query}                        margin, retained_90d[30], trend_pct,
                                                                         signal, last_event }
    signal         GET     /signal?lens={persona}                      { kicker, title, items[], quote }
    stream         SSE     /events  (spec v1, public)                  { time, domain, type, gloss, business }
    drawer/sheet   GET     /businesses/{id}                            { metrics, retained_90d[], audit{divergence},
                                                                         journal[6], iot[] }   (drawer/sheet — see mock)

  Event domains that must emit (detail.openly_operated) to feed the stream + recompute figures:
  accounting · purchasing · payments · labor · inventory · iot · invoicing.
-->
