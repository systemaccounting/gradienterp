    screener       GET     /businesses?sort={key}&dir={dir}            rows  { id, name, city, sector, rev_30d,

                                                                         signal, last_event }
    signal         GET     /signal?lens={persona}                      { kicker, title, items[], quote }
    stream         SSE     /events  (spec v1, public)                  { time, domain, type, gloss, business }
    drawer/sheet   GET     /businesses/{id}                            { metrics, retained_90d[], audit{divergence},
                                                                         journal[6], iot[] }   (drawer/sheet — see mock)

  Event domains that must emit (detail.openly_operated) to feed the stream + recompute figures:
  accounting · purchasing · payments · labor · inventory · iot · invoicing.
-->

<div id="root"></div>
<script type="module">
import { mount, state, html, sectorsTpl, on, spark, C, fmtMoney, SORT_LABELS, update } from './app.js';

// each region renders its empty/annotated state; the shared controls still drive the {tokens}.
const ticker = () => html`<div class="oo-ticker"><div class="oo-band oo-wide">
  <div style="flex:none;display:flex;align-items:center;gap:8px;padding:0 18px 0 30px;height:34px;background:#16181d;border-right:1px solid #2a2c31;"><span class="dot"></span><span class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:#b7b4a8;white-space:nowrap;">live opportunities</span></div>
  <div style="flex:1;display:flex;align-items:center;padding:0 16px;overflow:hidden;"><span class="oo-needs" style="white-space:nowrap;"><span class="m">awaiting</span> <b>GET /opportunities?top=7</b> — marquee items { text }</span></div>
</div></div>`;

// ── the api and the stream: every number on this page is a call on api.openlyoperated.biz, and the
// live one is a subscription on events.openlyoperated.biz. The curl beside each number is the lesson.
const API = 'https://api.openlyoperated.biz/v1';
const EVENTS_HOST = 'events.openlyoperated.biz';
const EVENTS_KEY = 'da2-3h4at3kbtjhwvpdsvdsjqtgz5e';   // subscribe-only, public; `terraform output events_subscribe_key`
// no-store: the page shows the api's answer now, not the browser's copy of a minute ago (a live repaint after a delta reads the table, not the cache)
const getJson = async (path) => { try { const r = await fetch(API + path, { cache: 'no-store' }); return r.ok ? await r.json() : null; } catch (_) { return null; } };
const curlOf = path => 'curl ' + API + path;

// a channel of the Events API in the browser, the AppSync Events protocol over WebSocket; reconnects
const subscribe = (channel, onEvent) => {
  const auth = { host: EVENTS_HOST, 'x-api-key': EVENTS_KEY };
  const header = btoa(JSON.stringify(auth)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const connect = () => {
    let ws;
    try { ws = new WebSocket('wss://' + EVENTS_HOST + '/event/realtime', ['aws-appsync-event-ws', 'header-' + header]); } catch (_) { return; }
    ws.onopen = () => ws.send(JSON.stringify({ type: 'connection_init' }));
    ws.onmessage = m => {
      let d; try { d = JSON.parse(m.data); } catch (_) { return; }
      if (d.type === 'connection_ack') ws.send(JSON.stringify({ type: 'subscribe', id: 'page', channel, authorization: auth }));
      if (d.type === 'data') for (const e of [].concat(d.event)) { try { onEvent(JSON.parse(e)); } catch (_) {} }
    };
    ws.onclose = () => setTimeout(connect, 3000);
  };
  connect();
};

// ── the metric shape, one component for both sides: {key, label, unit, grain, headline: {period, value},
// points: [{period, value}], definition, source: {curl}}. one card per metric: the label, the headline
// in its unit, the trend, the definition sentence (the metric's text of record), the call that
// produced it, and a way to propose a change to it.
const money = n => '$' + Math.round(n).toLocaleString();
const L = "font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#9a988c;";
const ISSUES = 'https://github.com/systemaccounting/gradienterp/issues/new';
// Every value from the url or the api is text: escaped before it meets markup. A published business
// types its own label, and a link carries whatever follows #b/.
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
const curlLine = c => '<code style="display:block;font-size:11px;color:#4a4840;background:#f4f3ee;border-radius:6px;padding:6px 8px;margin-top:10px;overflow-x:auto;white-space:nowrap;" title="the call that produced this">' + esc(c) + '</code>';
const sparkline = (pts, height) => {
  const h = height || 130;
  if (!pts || pts.length < 2) return '<div style="' + L + 'color:#c3c0b4;font-size:11px;letter-spacing:.06em;">awaiting a second period</div>';
  const w = 1000, mn = Math.min(...pts), mx = Math.max(...pts), rg = (mx - mn) || 1, up = pts[pts.length - 1] >= pts[0];
  const p = pts.map((v, i) => (i / (pts.length - 1) * w).toFixed(1) + ',' + (h - 6 - (v - mn) / rg * (h - 12)).toFixed(1)).join(' ');
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" style="width:100%;height:' + h + 'px;display:block;"><polyline points="' + p + '" fill="none" stroke="' + (up ? '#3a7d52' : '#b04a3f') + '" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>';
};
const fmtUnit = (v, unit) => v == null ? '—' : unit === 'ratio' ? (v * 100).toFixed(1) + '%' : unit === 'USD' ? money(v) : v.toLocaleString();
const metricCard = (m, live) => {
  const pts = (m.points || []).map(p => p.value).filter(v => v != null);
  // the metric issue form (.github/ISSUE_TEMPLATE/metric.yml), its fields filled by id
  const propose = ISSUES + '?template=metric.yml&title=' + encodeURIComponent('metric: ' + m.key) +
    '&key=' + encodeURIComponent(m.key) + '&definition=' + encodeURIComponent(m.definition);
  return '<div data-metric="' + esc(m.key) + '" style="flex:1 1 220px;min-width:220px;border:1px solid #e5e3da;border-radius:12px;padding:16px 18px;background:#fffefb;">' +
    '<div style="' + L + '">' + (live ? '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#7fd18b;margin-right:7px;vertical-align:middle;"></span>' : '') + esc(m.label) + ' · ' + esc(m.headline.period) + '</div>' +
    '<div style="font-size:30px;letter-spacing:-.02em;margin:4px 0 8px;">' + esc(fmtUnit(m.headline.value, m.unit)) + '</div>' +
    (pts.length > 1 ? '<div style="height:44px;">' + sparkline(pts, 44) + '</div>' : '') +
    '<div style="font-size:12px;color:#6d6b61;margin-top:10px;line-height:1.45;">' + esc(m.definition) + '</div>' +
    curlLine(m.source.curl) +
    '<a href="' + esc(propose) + '" target="_blank" rel="noopener" style="' + L + 'display:inline-block;margin-top:10px;color:#3a5fa8;text-decoration:none;">propose a change →</a>' +
    '</div>';
};
const metricsRow = (metrics, liveKeys) => '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:20px;">' + metrics.map(m => metricCard(m, liveKeys && liveKeys.has(m.key))).join('') + '</div>';

// the economy — GET /economy/counters rendered as the same metric cards a business shows (metricsRow
// below); ECONOMY fills after the first read and the live keys repaint on a /oob/counters delta
let ECONOMY = null;   // null = loading · [] = the api answered nothing · [metrics]
const LIVE_KEYS = new Set(['revenue', 'expense']);
const kpi = () => html`<div class="oo-kpi" data-mtab="opps"><div class="oo-band">
  <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:14px 0 0;"><span class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#4a4840;">the economy · every gerp, as it trades</span><span style="flex:1;"></span><a href="https://api.openlyoperated.biz/v1/llms.txt" class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#3a5fa8;text-decoration:none;">api.openlyoperated.biz/v1 →</a></div>
  ${ECONOMY === null ? html`<div class="oo-kpi-row">${['revenue','expense','margin'].map(l => html`<div class="oo-kpi-cell"><div class="lbl">${l}</div><div class="oo-kpi-val oo-ph">—</div></div>`)}</div>`
    : ECONOMY.length ? html`<div style="padding-bottom:16px;" .innerHTML=${metricsRow(ECONOMY, LIVE_KEYS)}></div>`
    : html`<div style="padding:8px 0 12px;"><span class="oo-needs"><span class="m">awaiting</span> <b>GET /economy/counters</b></span></div>`}
</div></div>`;

const opps = () => html`<div class="oo-oppsband" data-mtab="opps"><div class="oo-band oo-wide">
  <div style="display:flex;align-items:baseline;gap:14px;margin-bottom:14px;flex-wrap:wrap;"><h2 class="oo-h">open opportunities</h2><span class="oo-needs"><span class="m">awaiting</span> <b>GET /opportunities?lens=<span class="oo-tok">${state.persona}</span></b> — cards { tag, prize, title, where, cta_by_lens, activity, business_id }</span></div>
  <div style="display:flex;gap:14px;overflow:hidden;">
    <div class="oo-skel oo-oppcard-skel" style="display:flex;align-items:center;justify-content:center;padding:14px 16px;text-align:center;"><span class="oo-needs">opportunity card<br>1 of N · per lens</span></div>
    <div class="oo-skel oo-oppcard-skel"></div><div class="oo-skel oo-oppcard-skel"></div>
    <div class="oo-skel oo-oppcard-skel oo-desktoponly" style="opacity:.6;"></div><div class="oo-skel oo-oppcard-skel oo-desktoponly" style="opacity:.35;"></div>
  </div>
</div></div>`;

const left = () => html`<aside class="oo-left" data-mtab="biz">
  <div class="lbl" style="margin-bottom:11px;letter-spacing:.12em;">sector</div>${sectorsTpl(null)}
  <div class="oo-desktoponly">
    <div class="lbl" style="margin:26px 0 11px;letter-spacing:.12em;">event domains</div>
    <div class="mono" style="display:flex;flex-direction:column;gap:7px;font-size:11.5px;color:#6d6b61;">${['accounting','purchasing','payments','labor','inventory','iot','invoicing'].map(d=>html`<div style="display:flex;align-items:center;gap:8px;"><span style="width:7px;height:7px;border-radius:2px;background:#b3b0a4;"></span>${d}</div>`)}</div>
    <div class="mono" style="margin-top:26px;padding:13px 14px;border:1px dashed #d4d1c5;border-radius:10px;font-size:11px;line-height:1.5;color:#8a887d;">public · spec-compliant. every figure here recomputes from the published event stream.</div>
  </div>
</aside>`;

const skelRow = (op) => html`<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid #efeee8;${op}"><div style="min-width:0;"><div style="width:130px;height:13px;border-radius:3px;background:#eeece4;"></div><div style="width:90px;height:9px;border-radius:3px;background:#f1efe8;margin-top:6px;"></div></div><div style="text-align:right;flex:none;"><div style="width:54px;height:12px;border-radius:3px;background:#eeece4;margin-left:auto;"></div><div style="width:70px;height:16px;border-radius:4px;background:#f3f1ea;border:1px dashed #e3e0d5;margin-top:6px;"></div></div></div>`;
const skelCell = 'padding:.85em .9em;border-bottom:1px solid #efeee8;';
const skelTr = (op) => html`<tr style="border-bottom:1px solid #efeee8;${op}"><td style="padding:.7em 1em;border-bottom:1px solid #efeee8;"><div style="width:120px;height:12px;border-radius:3px;background:#eeece4;"></div><div style="width:64px;height:9px;border-radius:3px;background:#f1efe8;margin-top:5px;"></div></td><td style="${skelCell}"><span style="width:54px;height:10px;border-radius:3px;background:#f1efe8;display:inline-block;"></span></td><td style="${skelCell}text-align:right;"><span style="width:46px;height:11px;border-radius:3px;background:#eeece4;display:inline-block;"></span></td><td style="${skelCell}text-align:right;"><span style="width:34px;height:11px;border-radius:3px;background:#eeece4;display:inline-block;"></span></td><td style="${skelCell}"><span style="width:84px;height:18px;border-radius:4px;background:#f3f1ea;display:inline-block;border:1px dashed #e3e0d5;"></span></td><td style="${skelCell}"><span style="width:130px;height:10px;border-radius:3px;background:#f1efe8;display:inline-block;"></span></td><td style="${skelCell}text-align:right;"><span style="width:48px;height:10px;border-radius:3px;background:#f1efe8;display:inline-block;"></span></td></tr>`;
// the screener skeleton is the loading state; center() swaps to live rows once SCREENER resolves.
const skelCenter = () => html`<main class="oo-center" data-mtab="biz">
  <div style="display:flex;align-items:baseline;gap:12px;padding:0 0 10px;flex-wrap:wrap;"><h2 class="oo-h">business screener</h2><span class="oo-needs">resolving businesses…</span></div>
  <div class="oo-desktoponly oo-scroll" style="overflow:hidden;border:1px solid #e5e3da;border-radius:12px;background:#fffefb;">
    <table style="width:100%;border-collapse:collapse;font-size:13px;" cellspacing="0">
      <thead><tr style="background:#f5f4ef;">${['business','sector','rev 90d','margin','retained · 90d','signal','last event'].map((h,i)=>html`<th class="mono" style="text-align:${i===2||i===3||i===6?'right':'left'};padding:.85em 1em;font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#7d7b71;font-weight:600;border-bottom:1px solid #d4d1c5;white-space:nowrap;">${h}</th>`)}</tr></thead>
      <tbody>${[0,1,2,3,4,5].map(i=>skelTr(i>2?(i>4?'opacity:.3;':'opacity:.6;'):''))}</tbody>
    </table>
  </div>
  <div class="oo-mobileonly" style="border:1px solid #e5e3da;border-radius:12px;background:#fffefb;overflow:hidden;">${[0,1,2,3,4,5].map(i=>skelRow(i>3?'opacity:.5;':''))}</div>
</main>`;

// business screener — live, client-side fan-out over the directory + each gerp's /oob/financials. WIP +
// read-only: renders whatever rows resolve (one is fine), tolerant of missing columns (city/signal → —).
let SCREENER = null;  // null = loading (skeleton) · [] = resolved-empty · [rows] = live
const trendStr = b => (b.trendPct >= 0 ? '+' : '') + b.trendPct + '%';
const filteredSorted = () => {
  let list = (SCREENER || []).slice();
  if (state.sector !== 'all') list = list.filter(b => b.sector === state.sector);
  const q = state.query.trim().toLowerCase();
  if (q) list = list.filter(b => (b.name + ' ' + b.sector).toLowerCase().includes(q));
  const k = state.sortKey;
  list.sort((a, b) => {
    const av = k === 'name' ? a.name : k === 'margin' ? a.margin : k === 'trend' ? a.trendPct : a.rev;
    const bv = k === 'name' ? b.name : k === 'margin' ? b.margin : k === 'trend' ? b.trendPct : b.rev;
    return (av < bv ? -1 : av > bv ? 1 : 0) * state.sortDir;
  });
  return list;
};
const caret = k => state.sortKey === k ? (state.sortDir < 0 ? ' ↓' : ' ↑') : '';
const th = (label, key, right) => html`<th @click=${key ? () => on.sort(key) : null} class="mono" style="text-align:${right ? 'right' : 'left'};padding:.85em .9em;font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#7d7b71;font-weight:600;border-bottom:1px solid #d4d1c5;white-space:nowrap;${key ? 'cursor:pointer;' : ''}">${label}${key ? caret(key) : ''}</th>`;
const openBiz = id => () => { location.hash = '#b/' + encodeURIComponent(id); };
const center = () => {
  if (!SCREENER) return skelCenter();
  const list = filteredSorted();
  return html`<main class="oo-center" data-mtab="biz">
    <div style="display:flex;align-items:baseline;gap:12px;padding:0 0 14px;flex-wrap:wrap;"><h2 class="oo-h">business screener</h2><span class="mono" style="font-size:11.5px;color:#9a988c;">${list.length} openly-operated · sorted by ${SORT_LABELS[state.sortKey]}</span></div>
    ${list.length ? '' : html`<div class="oo-needs" style="padding:0 0 14px;">no openly-operated businesses match this filter.</div>`}
    <div class="oo-desktoponly oo-scroll" style="overflow-x:auto;border:1px solid #e5e3da;border-radius:12px;background:#fffefb;">
      <table style="width:100%;min-width:640px;border-collapse:collapse;font-size:13px;" cellspacing="0">
        <thead><tr style="background:#f5f4ef;">${th('business','name')}${th('sector')}${th('rev 90d','rev',1)}${th('margin','margin',1)}${th('retained · 90d','trend')}${th('signal')}${th('last event','',1)}</tr></thead>
        <tbody>${list.map(b => html`<tr class="oo-row" @click=${openBiz(b.id)} style="border-bottom:1px solid #efeee8;cursor:pointer;">
          <td style="padding:.7em 1em;border-bottom:1px solid #efeee8;"><div style="font-weight:600;font-size:13.5px;letter-spacing:-.01em;">${b.name}</div><div class="mono" style="font-size:10.5px;color:#9a988c;margin-top:1px;">${b.city}</div></td>
          <td class="mono" style="padding:.7em .6em;border-bottom:1px solid #efeee8;font-size:11px;color:#7d7b71;">${b.sectorLabel}</td>
          <td class="mono" style="padding:.7em .9em;border-bottom:1px solid #efeee8;text-align:right;font-size:13px;">${b.revFmt}</td>
          <td class="mono" style="padding:.7em .9em;border-bottom:1px solid #efeee8;text-align:right;font-size:13px;">${b.marginPct}</td>
          <td style="padding:.7em .9em;border-bottom:1px solid #efeee8;"><div style="display:flex;align-items:center;gap:9px;">${spark(b.series,b.color)}<span class="mono" style="font-size:12px;color:${b.color};font-weight:500;min-width:46px;">${trendStr(b)}</span></div></td>
          <td style="padding:.7em .9em;border-bottom:1px solid #efeee8;max-width:230px;"><span class="mono" style="font-size:12px;color:#c4c1b4;">—</span></td>
          <td class="mono" style="padding:.7em 1em;border-bottom:1px solid #efeee8;text-align:right;font-size:11px;color:#9a988c;white-space:nowrap;">${b.lastEvent}</td></tr>`)}${[0,1,2,3,4].map(i=>skelTr(`opacity:${(0.5-i*0.09).toFixed(2)};`))}</tbody>
      </table>
    </div>
    <div class="oo-mobileonly" style="border:1px solid #e5e3da;border-radius:12px;background:#fffefb;overflow:hidden;">${list.map(b => html`
      <div class="oo-row" @click=${openBiz(b.id)} style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid #efeee8;cursor:pointer;">
        <div style="min-width:0;"><div style="font-weight:600;font-size:14px;letter-spacing:-.01em;">${b.name}</div><div class="mono" style="font-size:10px;color:#9a988c;margin-top:1px;">${b.sectorLabel} · ${b.city}</div></div>
        <div style="text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;"><div class="mono" style="font-size:13px;">${b.revFmt}</div><div style="display:flex;align-items:center;gap:7px;">${spark(b.series,b.color)}<span class="mono" style="font-size:11px;color:${b.color};font-weight:500;">${trendStr(b)}</span></div><div class="mono" style="font-size:10px;color:#9a988c;">marg ${b.marginPct}</div></div>
      </div>`)}${[0,1,2,3].map(i=>skelRow(`opacity:${(0.5-i*0.11).toFixed(2)};`))}</div>
  </main>`;
};

const right = () => html`<aside class="oo-right" data-mtab="stream">
  <div style="border:1px solid #d4d1c5;border-radius:12px;padding:16px;background:#fffefb;">
    <div class="mono" style="font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:#9a988c;"><span class="oo-tok">${state.persona}</span> lens</div>
    <div class="oo-ph" style="font-size:14.5px;font-weight:600;margin:5px 0 12px;">—</div>
    <div class="oo-skel" style="height:14px;margin-bottom:7px;"></div><div class="oo-skel" style="height:14px;margin-bottom:7px;width:85%;"></div><div class="oo-skel" style="height:14px;width:70%;"></div>
    <div style="margin-top:13px;padding-top:11px;border-top:1px solid #efeee8;"><span class="oo-needs"><span class="m">awaiting</span> <b>GET /signal?lens=<span class="oo-tok">${state.persona}</span></b> — { kicker, title, items[], quote }</span></div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;margin:20px 0 11px;"><span class="dot"></span><span class="mono" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:#7d7b71;">live event stream</span><span style="flex:1;"></span><span class="mono" style="font-size:10px;color:#b3b0a4;">spec v1 · public</span></div>
  <div class="oo-scroll" style="overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;border:1px solid #e5e3da;border-radius:11px;background:#fffefb;padding:9px;">
    <div style="padding-bottom:2px;"><span class="oo-needs"><span class="m">awaiting</span> <b>SSE /events</b> — { time, domain, type, gloss, business } · openly_operated only</span></div>
    <div class="oo-skel" style="height:46px;"></div><div class="oo-skel" style="height:46px;opacity:.7;"></div><div class="oo-skel" style="height:46px;opacity:.45;"></div><div class="oo-skel" style="height:46px;opacity:.25;"></div>
  </div>
</aside>`;

mount({ root: document.getElementById('root'), regions: { ticker, kpi, opps, left, center, right }, mockLink: true });

// ── the economy on the home page: revenue, expense and margin off GET /economy/counters; revenue and
// expense repaint as /oob/counters delivers a delta
(async () => {
  const paint = async () => {
    const ms = await Promise.all(['revenue', 'expense', 'margin'].map(k => getJson('/economy/counters?signal=' + k)));
    ECONOMY = ms.filter(m => m && m.key);
    update();
  };
  await paint();
  let timer = null;
  // a delta and the counter's ADD race; the repaint reads the table a moment later
  subscribe('/oob/counters', () => { clearTimeout(timer); timer = setTimeout(paint, 1500); });
})();

// ── #b/<gerp_id>: a business's public book as a FULL PAGE, off the api: the directory row for its
// name and place, its catalog, then each source through the read-through, rendered by `kind`. the
// same surface an agent iterates: GET /gerps → GET /gerps/{id}/sources → GET /gerps/{id}/sources/{source}
(() => {
  // search results — a light picker overlay (selecting → route to the full page) ──
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;z-index:50;background:rgba(20,22,26,.5);display:none;justify-content:center;padding:70px 20px;overflow:auto;';
  const panel = document.createElement('div');
  panel.style.cssText = "background:#fffefb;border:1px solid #e5e3da;border-radius:14px;max-width:640px;width:100%;height:max-content;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.28);font-family:'Space Grotesk',sans-serif;";
  overlay.appendChild(panel); document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.style.display = 'none'; });
  const place = g => [g.city, g.state].filter(Boolean).join(', ');

  async function search(q) {
    overlay.style.display = 'flex';
    panel.innerHTML = '<div style="' + L + '">searching · "' + esc(q) + '"…</div>';
    const path = '/gerps?q=' + encodeURIComponent(q);
    const gerps = ((await getJson(path)) || {}).gerps || [];
    panel.innerHTML = '<div style="' + L + 'margin-bottom:14px;">search results · "' + esc(q) + '"</div>' +
      (gerps.length ? gerps.map(g =>
        '<div class="oo-sr" data-gid="' + esc(g.gerp_id) + '" style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border:1px solid #e5e3da;border-radius:10px;margin-bottom:8px;cursor:pointer;">' +
          '<div><div style="font-weight:600;">' + esc(g.label) + '</div><div style="font-size:12px;color:#7d7b71;">' + esc([(g.naics_intended || []).join(' '), place(g)].filter(Boolean).join(' · ')) + '</div></div><div style="color:#df722a;">→</div></div>').join('')
        : '<div style="color:#7d7b71;">no openly-operated businesses match.</div>') + curlLine(curlOf(path));
    panel.querySelectorAll('.oo-sr').forEach(el => el.addEventListener('click', () => {
      overlay.style.display = 'none'; location.hash = '#b/' + encodeURIComponent(el.dataset.gid);
    }));
  }

  // the business dashboard — a FULL PAGE ──
  const page = document.createElement('div');
  page.id = 'oo-biz';
  page.style.cssText = "position:fixed;inset:0;z-index:60;background:#faf9f5;overflow:auto;display:none;font-family:'Space Grotesk',sans-serif;color:#1a1a17;";
  document.body.appendChild(page);

  const stat = (l, v, c) => '<div style="flex:1;min-width:180px;padding:20px 0;"><div style="' + L + '">' + l + '</div><div style="font-size:38px;font-weight:600;letter-spacing:-.01em;' + (c ? 'color:' + c : '') + '">' + v + '</div></div>';
  const sec = (t, body, curl) => '<section style="border-top:1px solid #e5e3da;padding:26px 0;"><div style="' + L + 'margin-bottom:14px;">' + esc(t) + '</div>' + body + (curl ? curlLine(curl) : '') + '</section>';
  const awaiting = note => '<div style="' + L + 'color:#c3c0b4;font-size:11px;letter-spacing:.06em;">' + esc(note) + '</div>';
  const acct = a => (a || '').toLowerCase().replace(/_/g, ' ');
  const shell = inner => '<div style="background:#16181d;"><div style="max-width:1080px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;">' +
      '<a href="#" style="' + L + 'color:#b7b4a8;text-decoration:none;">← openlyoperated.biz</a><span style="flex:1;"></span><span style="' + L + 'color:#6d6b61;">openly-operated · public book</span></div></div>' +
    '<div style="max-width:1080px;margin:0 auto;padding:44px 28px 90px;">' + inner + '</div>';

  const incomeStatement = is => {
    if (!is) return awaiting('awaiting the income-statement read');
    const lines = (arr, c) => arr.map(x => '<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:14px;"><span style="color:#4a4840;">' + esc(acct(x.account)) + '</span><span style="' + c + '">' + money(x.amount) + '</span></div>').join('');
    return '<div style="max-width:520px;"><div style="' + L + 'margin-bottom:3px;">revenue</div>' + lines(is.revenue, 'color:#3a7d52;') +
      '<div style="' + L + 'margin:16px 0 3px;">expenses</div>' + lines(is.expenses, 'color:#b04a3f;') + '</div>';
  };
  const journalList = j => (!j || !j.length) ? awaiting('awaiting a ledger-tail read') :
    '<div style="font-size:13px;">' + j.map(e => '<div style="display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid #efeee8;"><span style="' + L + 'font-size:11px;min-width:52px;">' + esc(e.date) + '</span><span style="flex:1;"><span style="color:#a8a599;font-size:11px;">dr ' + esc(acct(e.debit)) + ' / cr ' + esc(acct(e.credit)) + '</span></span><span>' + money(e.amount) + '</span></div>').join('') + '</div>';

  const inventoryTable = inv => {
    if (!inv || !inv.items || !inv.items.length) return awaiting('awaiting the inventory read');
    const rows = inv.items.map(it =>
      '<div style="display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid #efeee8;font-size:13px;">' +
        '<span style="flex:1;">' + esc(it.name) + '</span>' +
        '<span style="' + L + 'font-size:11px;min-width:96px;text-align:right;">' + esc(Number(it.quantity).toLocaleString()) + ' ' + esc(it.unit) + '</span>' +
        '<span style="min-width:88px;text-align:right;">' + money(it.quantity * it.unit_cost) + '</span></div>').join('');
    return '<div style="' + L + 'margin-bottom:10px;">' + esc(inv.sku_count) + ' skus · ' + money(inv.inventory_value) + ' on hand</div>' + rows;
  };

  // statbar — the financials centerpiece (the ledger renderer's header block)
  const statbar = f => '<div style="display:flex;gap:36px;flex-wrap:wrap;border-top:1px solid #e5e3da;margin-top:20px;">' +
    stat('revenue', money(f.revenue), '#3a7d52') + stat('expenses', money(f.expenses), '#b04a3f') +
    stat('net income', money(f.net_income), f.net_income >= 0 ? '#3a7d52' : '#b04a3f') + '</div>';

  // renderers keyed by the catalog `kind`; the fallback renders any unknown kind as a labelled stub, so a
  // newly-published source shows up the moment a module registers it — before its renderer ships.
  // each takes (data, source, curl): the metric cards carry their own curl; the rest show it under the section
  const RENDERERS = {
    metrics: d => metricsRow(d.metrics || []),
    ledger: (f, s, curl) => statbar(f) +
      sec('retained earnings · ' + f.period, sparkline(f.trend)) +
      sec('income statement', incomeStatement(f.income_statement)) +
      sec('recent journal', journalList(f.journal), curl),
    ddb_catalog: (inv, s, curl) => sec(s.label, inventoryTable(inv), curl),
  };
  const renderSource = (s, data, curl) => {
    if (!data || data.error) return sec(s.label, awaiting('awaiting the ' + s.label + ' read'), curl);
    const r = RENDERERS[s.kind];
    return r ? r(data, s, curl) : sec(s.label, awaiting('no renderer for kind “' + s.kind + '” yet — the JSON is one call away'), curl);
  };

  async function renderPage(gid) {
    page.style.display = 'block'; document.body.style.overflow = 'hidden'; page.scrollTop = 0;
    page.innerHTML = shell('<div style="' + L + '">loading ' + esc(gid) + '…</div>');
    const [dir, cat] = await Promise.all([getJson('/gerps'), getJson('/gerps/' + encodeURIComponent(gid) + '/sources')]);
    const g = ((dir || {}).gerps || []).find(x => x.gerp_id === gid);
    if (!g || !cat || cat.error) { page.innerHTML = shell('<div style="color:#b04a3f;">' + esc(gid) + ' does not publish</div>' + curlLine(curlOf('/gerps'))); return; }
    // the page is a thin client: fetch each published source in parallel, then render it by kind
    const sources = cat.sources || [];
    const paths = sources.map(s => '/gerps/' + encodeURIComponent(gid) + '/sources/' + encodeURIComponent(s.key));
    const datas = await Promise.all(paths.map(getJson));
    const header =
      '<div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;"><h1 style="margin:0;font-size:40px;letter-spacing:-.02em;">' + esc(g.label) + '</h1><span style="' + L + 'font-size:12px;">' + esc([(g.naics_intended || []).join(' '), place(g)].filter(Boolean).join(' · ')) + '</span></div>' +
      '<div style="' + L + 'margin:7px 0 4px;">live business dashboard · read through from the business\'s own account</div>' +
      curlLine(curlOf('/gerps/' + encodeURIComponent(gid) + '/sources'));
    // metrics are the header, the statement and the rest the detail — whatever order the catalog lists
    const order = sources.map((s, i) => [s, datas[i], curlOf(paths[i])]).sort((a, b) => (a[0].kind === 'metrics' ? 0 : 1) - (b[0].kind === 'metrics' ? 0 : 1));
    const body = order.map(([s, d, c]) => renderSource(s, d, c)).join('') ||
      '<div style="' + L + 'margin-top:24px;">this business publishes no sources yet.</div>';
    const live = sec('as it happens', '<div id="oo-live" style="font-size:13px;">' + awaiting('subscribed to /oob/' + gid + '/journal-entry-posted — the next posted entry lands here') + '</div>',
      'curl -N -H "x-api-key: …" "' + API + '/events?channel=/oob/' + gid + '/journal_entry.posted"');
    page.innerHTML = shell(header + body + live);
    subscribe('/oob/' + gid + '/journal-entry-posted', ev => {
      const box = document.getElementById('oo-live'); if (!box) return;
      const d = ev.detail || {};
      const legs = (d.line_items || []).map(li => (li.side === 'DEBIT' ? 'dr ' : 'cr ') + acct(li.account) + ' ' + money(li.amount)).join(' · ');
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid #efeee8;';
      row.innerHTML = '<span style="' + L + 'font-size:11px;min-width:52px;">' + esc((ev.at || '').slice(11, 19)) + '</span><span style="flex:1;">' + esc(legs) + '</span>';
      if (!box.dataset.live) { box.dataset.live = '1'; box.innerHTML = ''; }
      box.prepend(row);
    });
  }

  function route() {
    const m = location.hash.match(/^#b\/(.+)$/);
    if (m) renderPage(decodeURIComponent(m[1]));
    else { page.style.display = 'none'; document.body.style.overflow = ''; }
  }
  window.addEventListener('hashchange', route);
  route();

  const input = document.querySelector('input[placeholder^="search businesses"]');
  if (input) input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); const q = e.target.value.trim(); if (q) search(q); } });
})();

// ── the business screener: GET /gerps, then each gerp's financials through the read-through ──
// client-side (no operator aggregation) — one row per business, tolerant of what's missing. row → #b/<gerp_id>
(async () => {
  const gerps = ((await getJson('/gerps')) || {}).gerps || [];
  const rows = await Promise.all(gerps.map(async g => {
    if (!(g.sources || []).some(s => s.key === 'financials')) return null;
    const f = await getJson('/gerps/' + encodeURIComponent(g.gerp_id) + '/sources/financials');
    if (!f || f.error) return null;
    const series = (f.trend && f.trend.length > 1) ? f.trend : [0, 0];
    const first = series[0], lastv = series[series.length - 1];
    const sector = (g.naics_intended || [])[0] || '';
    return {
      id: g.gerp_id, name: g.label, sector, sectorLabel: sector || '—', city: [g.city, g.state].filter(Boolean).join(', ') || '—',
      rev: f.revenue || 0, revFmt: fmtMoney(f.revenue || 0),
      margin: f.revenue ? f.net_income / f.revenue : 0,
      marginPct: f.revenue ? Math.round(f.net_income / f.revenue * 100) + '%' : '—',
      series, color: lastv >= first ? C.UP : C.DOWN,
      trendPct: first ? Math.round((lastv - first) / Math.abs(first) * 100) : 0,
      lastEvent: (f.journal && f.journal[0]) ? f.journal[0].date : '—',
    };
  }));
  SCREENER = rows.filter(Boolean);
  update();
})();
</script>
</body>
</html>
