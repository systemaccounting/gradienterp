# terraform validate in every directory holding .tf files: init -backend=false, so no state and no
# credentials. Terraform is the version the roots are applied with.
name: terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - run: bash .github/workflows/tf-validate-all.sh
