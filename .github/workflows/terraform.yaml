# terraform validate in every directory holding .tf files: init -backend=false, so no state and no
# credentials. Terraform is the version the roots are applied with.
name: terraform

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      # formatting first: a file terraform fmt would change fails here, with the diff
      - run: terraform fmt -check -recursive -diff

      # The provider zips, one per version the lock files name, downloaded once and cached. The lock
      # files carry the macs' h1: checksums, and init checks a mirrored zip against their zh:
      # checksums, which cover linux.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/terraform-providers
          key: terraform-providers-linux_amd64-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: terraform-providers-linux_amd64-

      # The mirror holds the zips. Without a plugin cache, init unpacks the aws provider (~840 MB)
      # into every one of the 46 directories, ~39 GB of writes and four minutes; with one, the
      # first init of a version unpacks it into the cache and every later init links to it. The
      # lock files carry the macs' h1: checksums, so a linux install from the cache cannot be
      # checked against them: the may-break setting lets init write the linux hash into the
      # runner's copy of the lock file, which nothing commits.
      - name: the provider mirror and the plugin cache
        run: |
          bash .github/workflows/tf-provider-mirror.sh "$RUNNER_TEMP/terraform-providers"
          mkdir -p "$RUNNER_TEMP/terraform-plugin-cache"
          printf 'plugin_cache_dir = "%s"\nplugin_cache_may_break_dependency_lock_file = true\nprovider_installation {\n  filesystem_mirror {\n    path = "%s"\n  }\n  direct {}\n}\n' \
            "$RUNNER_TEMP/terraform-plugin-cache" "$RUNNER_TEMP/terraform-providers" > "$RUNNER_TEMP/terraform.rc"
          echo "TF_CLI_CONFIG_FILE=$RUNNER_TEMP/terraform.rc" >> "$GITHUB_ENV"

      - run: bash .github/workflows/tf-validate-all.sh
