# The browser suite against the local stack: scripts/e2e.sh starts scripts/local-dev.sh and runs
# smoke:local. No AWS and no secret: `e2e.sh --configure` writes the local seed into .env, so a pull
# request from a fork runs it too.
name: e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            modules/agent/docker/requirements.txt

      - run: bash scripts/local-dev.sh --install

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      # the suite's install, chromium, and the local seed in .env
      - run: bash scripts/e2e.sh --configure

      - name: chromium's system libraries
        working-directory: tests/e2e
        run: npx playwright install-deps chromium

      - run: bash scripts/e2e.sh

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: tests/e2e/test-results
          retention-days: 14
