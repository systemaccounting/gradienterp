# The local-mode unit suites, with the schema lint scripts/test.sh runs before them. No AWS: moto
# stands in, started by the script. The suite is Python test_*.py and Node *.test.mjs; each runs on
# the version its lambdas run on (python3.12, nodejs22.x).
name: unit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            modules/agent/docker/requirements.txt

      # the agent container's own requirements too: its tests load modules/agent/docker/entrypoint.py
      - run: pip install -r tests/requirements.txt -r modules/agent/docker/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # the Node lambdas' own dependencies (the AWS SDK clients their tests import): each lambda dir
      # with a lock file, installed as its zip is built
      - name: the Node lambdas' dependencies
        run: |
          find modules prod -name package-lock.json -not -path '*/node_modules/*' | while read -r lock; do
            (cd "$(dirname "$lock")" && npm ci --no-audit --no-fund)
          done

      - run: bash scripts/test.sh
