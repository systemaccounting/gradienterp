# Ingests the repo's playbooks — every modules/**/kb.md — into each gerp's Bedrock knowledge base with
# scripts/sync_gerp_playbooks.sh, one job over the fleet, ten gerps at a time through GNU parallel: on
# a push to main that touches a kb.md (every active gerp), by dispatch (`-f gerp=<id>|all`), or called
# from deploy.yaml (`-f playbooks=true`). One log group and one summary section per gerp; every gerp
# runs, and the job fails at the end naming the ones that failed. The
# knowledge base and its data source are found by name in the gerp's account, so no id is stored.
# It runs on its checkout: no source upload. The per-customer build syncs at provisioning too.
name: playbooks

on:
  push:
    branches: [main]
    paths:
      - modules/**/kb.md
  workflow_dispatch:
    inputs:
      gerp:
        description: a gerp id, a comma list, or all (every active gerp)
        type: string
        default: all
  workflow_call:
    inputs:
      gerp:
        description: a gerp id, a comma list, or all (every active gerp)
        type: string
        default: all

permissions:
  contents: read
  id-token: write

jobs:
  gerps:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 10
    outputs:
      list: ${{ steps.gerps.outputs.list }}
      timeout: ${{ steps.gerps.outputs.timeout }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/aws
        with:
          role: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      - id: gerps
        env:
          GERP: ${{ inputs.gerp || 'all' }}
        run: |
          if [ "$GERP" = all ]; then
            # every gerp that runs: an active row with a real account, as deploy.py's _active_rows reads them
            list="$(aws dynamodb scan --table-name gerp-customers --profile operator-org --no-cli-pager \
              --filter-expression '#s = :a AND attribute_exists(aws_account_id)' \
              --expression-attribute-names '{"#s": "status"}' --expression-attribute-values '{":a": {"S": "active"}}' \
              --projection-expression gerp_id --output json | jq -c '[.Items[].gerp_id.S] | sort')"
          else
            list="$(jq -Rc 'split(",") | map(gsub("^ +| +$"; "")) | map(select(length > 0))' <<< "$GERP")"
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "timeout=$(( 20 + $(jq length <<< "$list") ))" >> "$GITHUB_OUTPUT"   # a minute a gerp, ten at a time
          echo "gerps: $(jq -r 'join(", ")' <<< "$list")" >> "$GITHUB_STEP_SUMMARY"

  sync:
    needs: gerps
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: ${{ fromJSON(needs.gerps.outputs.timeout) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the diff from each gerp's stamp needs the history
      - uses: ./.github/actions/aws
        with:
          role: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      - name: sync
        env:
          LIST: ${{ needs.gerps.outputs.list }}
        run: |
          # the runner's composition of scripts/sync_gerp_playbooks.sh: the list through GNU parallel, ten
          # at a time, `-k` so the log groups come in list order and never interleave, `--halt never` so
          # every gerp runs; each task writes its summary section to a file, concatenated in order after
          rc=0
          jq -r '.[]' <<< "$LIST" | parallel -k -j 10 --halt never --joblog "$RUNNER_TEMP/jobs.log" \
            'echo "::group::{}"; bash scripts/sync_gerp_playbooks.sh {} > "$RUNNER_TEMP/{}.md" || { echo {} >> "$RUNNER_TEMP/failed"; false; }; rc=$?; echo "::endgroup::"; exit $rc' \
            || rc=$?
          for gerp in $(jq -r '.[]' <<< "$LIST"); do cat "$RUNNER_TEMP/$gerp.md" 2>/dev/null || true; done >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" -eq 0 ] || { echo "failed: $(tr '\n' ' ' < "$RUNNER_TEMP/failed")" >&2; exit 1; }
